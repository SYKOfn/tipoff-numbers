name: update
on:
  schedule:
    - cron: "23 */3 * * *"     # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "model/**", "site/*.*", "data/overrides/**", ".github/workflows/update.yml"]
concurrency:
  group: update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch from ESPN, rebuild, predict, freeze and score
        run: python -m pipeline.run
      - name: Tune and backtest (first run, then whenever results are missing)
        run: |
          if [ ! -f backtest/results.json ]; then
            python -m backtest.run && python -m pipeline.run --no-collect
          fi
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data model/tuned.json backtest/results.json 2>/dev/null || true
          git commit -q -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull -q --rebase -X theirs origin main && git push -q
      - name: Package website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  # Needs Settings -> Pages -> Source: "GitHub Actions".
  publish:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
