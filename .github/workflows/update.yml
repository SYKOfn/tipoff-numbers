name: update
# runs hourly near tip-off; see pipeline/should_run.py
on:
  schedule:
    - cron: "8,23,38,53 * * * *"  # every 15 min; the gate skips quiet times (3-hourly, hourly near tip-off, every 15 min in the last 75)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "model/**", "site/*.*", "data/overrides/**", ".github/workflows/update.yml"]
concurrency:
  group: update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Gate (scheduled runs only)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m pipeline.should_run
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Tests, including the feed readers against saved real replies (a failure stops the run; the site stays as it was)
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q tests
      - name: Fetch from ESPN (+ odds when ODDS_API_KEY is set), rebuild, predict, freeze and score
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_BOOKS: ${{ vars.ODDS_API_BOOKS }}
          ODDS_API_DAILY: ${{ vars.ODDS_API_DAILY }}
          ODDS_API_PROPS: ${{ vars.ODDS_API_PROPS }}
        run: python -m pipeline.run
      - name: Tune and backtest (first run, then whenever results are missing)
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ ! -f backtest/results.json ]; then
            python -m backtest.run && python -m pipeline.run --no-collect
          fi
      - name: Safety checks (a failed check keeps the last good site and fails the run, which emails the owner)
        id: checks
        if: steps.gate.outputs.run == 'true'
        run: |
          rm -f site/data/checks_failed.json
          if ! python -m pipeline.checks; then
            cp site/data/checks.json /tmp/checks.json
            git checkout HEAD -- site/data
            cp /tmp/checks.json site/data/checks_failed.json
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data model/tuned.json backtest/results.json 2>/dev/null || true
          git commit -q -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull -q --rebase -X theirs origin main && git push -q
      - name: Package website
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Report a failed safety check
        if: steps.checks.outputs.failed == 'true'
        run: |
          echo "Safety checks failed: the site kept its last good version."
          cat site/data/checks_failed.json
          exit 1
  # Needs Settings -> Pages -> Source: "GitHub Actions".
  publish:
    needs: update
    if: needs.update.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
