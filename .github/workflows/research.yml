name: research
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "python module and arguments, e.g. tools.market_history 2026 2027"
        required: true
concurrency:
  group: research
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m ${{ github.event.inputs.cmd }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds tests/fixtures 2>/dev/null || true
          git commit -q -m "Research data" || echo "no changes"
          git pull -q --rebase -X theirs origin main && git push -q
