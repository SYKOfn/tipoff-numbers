name: site-check
# Every change to the site's code is opened in a real browser at desktop and phone size: script errors, pages that
# scroll sideways or serious accessibility problems (axe, WCAG 2 AA) fail the run. Data updates don't trigger it.
on:
  push:
    paths: ["site/app.js", "site/styles.css", "site/index.html", "tools/site_check.py", ".github/workflows/site-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python -m tools.site_check --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: /tmp/site_check/*.png
          retention-days: 7
